name: Deploy VendorSentry

on:
  push:
    branches: [main]

jobs:
  # ── Backend: build + push to ECR + force new ECS deployment ──────────────
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd backend
          docker build --platform linux/amd64 -t $ECR_REGISTRY/vendorsentry:latest .
          docker push $ECR_REGISTRY/vendorsentry:latest

      - name: Force new ECS deployments
        run: |
          for svc in vendorsentry-api vendorsentry-worker vendorsentry-beat; do
            if aws ecs describe-services \
              --cluster vendorsentry \
              --services $svc \
              --query 'services[0].serviceName' \
              --output text | grep -q "$svc"; then
              aws ecs update-service \
                --cluster vendorsentry \
                --service $svc \
                --force-new-deployment
            else
              echo "Service $svc not found, skipping..."
            fi
          done

  # ── Frontend: Vercel handles this automatically via its GitHub integration ──
  # No job needed here — Vercel detects pushes to main and deploys automatically
  # once the GitHub integration is configured (Vercel dashboard → Git → Connect)
